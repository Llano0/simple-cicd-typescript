<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator :)</title>
</head>
<body>
  <h1>Calculator =) </h1>

  <input type="number" id="num1" placeholder="First number" />

  <select id="operation">
    <option value="sum">+</option>
    <option value="sub">−</option>
    <option value="mult">×</option>
    <option value="div">÷</option>
  </select>

  <input type="number" id="num2" placeholder="Second number" />

  <button type="button" id="btnCalculate">Calculate</button>

  <p>Result: <strong id="result">—</strong></p>

  <!-- Load all functions -->
  <script src="sum.js"></script>
  <script src="sub.js"></script>
  <script src="mult.js"></script>
  <script src="div.js"></script>

  <script>
    document.getElementById('btnCalculate').addEventListener('click', function () {
      var a = Number(document.getElementById('num1').value) || 0;
      var b = Number(document.getElementById('num2').value) || 0;
      var operation = document.getElementById('operation').value;

      var result;

      if (operation === 'sum') {
        result = sum(a, b);
      } 
      else if (operation === 'sub') {
        result = sub(a, b);
      } 
      else if (operation === 'mult') {
        result = mult(a, b);
      } 
      else if (operation === 'div') {
        result = div(a, b);
      }

      document.getElementById('result').textContent = result;
    });
  </script>
</body>
</html>
